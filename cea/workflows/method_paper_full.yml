# DAYSIM radiation, occupancy, and demand for one scenario.
# Set METHOD_PAPER_SCENARIO and MUBES_APPLIANCE_PROFILES_FOLDER first.
- config: default
  "general:scenario": "${METHOD_PAPER_SCENARIO}"
  "general:debug": false
  "general:multiprocessing": true
  "general:number-of-cpus-to-keep-free": 1
  "radiation:buildings": ""
  "radiation:roof-grid": 10
  "radiation:walls-grid": 200
  "radiation:zone-geometry": 2
  "radiation:surrounding-geometry": 5
  "radiation:consider-floors": true
  "radiation:neglect-adjacent-buildings": false
  "radiation:albedo": 0.2
  "radiation:rad-ab": 4
  "radiation:rad-ad": 512
  "radiation:rad-as": 32
  "radiation:rad-ar": 20
  "radiation:rad-aa": 0.15
  "radiation:rad-lr": 8
  "radiation:rad-st": 0.5
  "radiation:rad-sj": 0.7
  "radiation:rad-lw": 0.05
  "radiation:rad-dj": 0.7
  "radiation:rad-ds": 0
  "radiation:rad-dr": 0
  "radiation:rad-dp": 32
  "radiation:n-buildings-in-chunk": 100
  "radiation:write-sensor-data": true
  "occupancy:buildings": ""
  "occupancy:occupancy-model": deterministic
  "occupancy:ventilation-mode": area
  "occupancy:ventilation-area-rate-lpsm2": 0.35
  "occupancy:use-mubes-appliance-profiles": true
  "occupancy:mubes-appliance-profiles-folder": "${MUBES_APPLIANCE_PROFILES_FOLDER}"
  "occupancy:mubes-appliance-profile-map": ""
  "demand:buildings": ""
  "demand:appliance-heat-gain-fraction": 0.55
  "demand:use-dynamic-infiltration-calculation": false
  "demand:subtract-infiltration-from-ventilation": false
  "demand:overheating-warning": false
- script: radiation
- script: occupancy
- script: demand
